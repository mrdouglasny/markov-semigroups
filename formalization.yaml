      note: "Bakry-Émery curvature ρ ⟹ Poincaré(ρ)."
    - source: "ISBN:978-3-319-00226-2"
      lean: "BakryEmerySpace.satisfiesLogSobolev"
      module: "MarkovSemigroups.Diffusion.CarreDuChamp"
