name = "MarkovSemigroups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MarkovSemigroups"]

[leanOptions]
autoImplicit = false

[[require]]
name = "HilleYosida"
git = "https://github.com/mrdouglasny/hille-yosida.git"
