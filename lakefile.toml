[package]
name = "MarkovSemigroups"
leanOptions = [
  { name = "autoImplicit", value = false }
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.29.0"

[[require]]
name = "HilleYosida"
git = "https://github.com/mrdouglasny/hille-yosida.git"
rev = "main"

[[require]]
name = "GaussianField"
git = "https://github.com/mrdouglasny/gaussian-field.git"
rev = "main"

[[lean_lib]]
name = "MarkovSemigroups"
